services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data


  airflow:
    build:
      context: .

      dockerfile_inline: |
        FROM apache/airflow:3.0.6

        COPY requirements.txt /requirements.txt

        RUN pip install --no-cache-dir -r /requirements.txt

    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow

      AIRFLOW_CONN_SNOWFLAKE_DEFAULT: >-
        snowflake://${SNOWFLAKE_USER}:${SNOWFLAKE_PASSWORD}@/?account=eg52690.us-east-2.aws&database=ECOMMERCE_DATA_PLATFORM&schema=RAW&warehouse=ECOMMERCE_WH&role=ACCOUNTADMIN

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - C:/Users/bigal/.aws:/home/airflow/.aws:ro
      - ./sql:/opt/airflow/sql:ro
    ports:
      - "8080:8080"

    command: >
      bash -c "
      airflow db migrate &&
      airflow standalone
      "


volumes:
  airflow_postgres_data: